name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/pedidos-veloz

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        service:
          - gateway
          - inventory
          - orders
          - payments

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_K8S_DEPLOY == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || {
            echo "Secret KUBE_CONFIG não configurado."
            exit 1
          }

          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Apply namespace and infrastructure
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/infrastructure.yaml
          kubectl apply -f k8s/monitoring.yaml
          kubectl apply -f k8s/grafana-ingress.yaml

      - name: Apply application manifests
        run: kubectl apply -f k8s/services.yaml

      - name: Update application images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/pedidos-veloz
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl -n pedidos-veloz set image deployment/gateway \
            gateway="${IMAGE_PREFIX}-gateway:${IMAGE_TAG}"

          kubectl -n pedidos-veloz set image deployment/orders \
            orders="${IMAGE_PREFIX}-orders:${IMAGE_TAG}"

          kubectl -n pedidos-veloz set image deployment/payments \
            payments="${IMAGE_PREFIX}-payments:${IMAGE_TAG}"

          kubectl -n pedidos-veloz set image deployment/inventory \
            inventory="${IMAGE_PREFIX}-inventory:${IMAGE_TAG}"

      - name: Verify application rollouts
        run: |
          for service in gateway orders payments inventory; do
            kubectl -n pedidos-veloz rollout status \
              "deployment/${service}" \
              --timeout=180s
          done
