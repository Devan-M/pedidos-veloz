name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'services/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create temporary secret.env
        run: |
          cat > k8s/base/secret.env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          EOF
          chmod 600 k8s/base/secret.env

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/base > /tmp/pedidos-veloz-k8s.yaml
          kubectl apply --dry-run=server \
            -f /tmp/pedidos-veloz-k8s.yaml

      - name: Deploy with Kustomize
        run: |
          kubectl apply -k k8s/base

      - name: Wait for infrastructure
        run: |
          kubectl rollout status deployment/postgres \
            -n pedidos-veloz --timeout=300s
          kubectl rollout status deployment/redis \
            -n pedidos-veloz --timeout=300s
          kubectl rollout status deployment/rabbitmq \
            -n pedidos-veloz --timeout=300s

      - name: Wait for microservices
        run: |
          kubectl rollout status deployment/api-gateway \
            -n pedidos-veloz --timeout=300s
          kubectl rollout status deployment/orders-service \
            -n pedidos-veloz --timeout=300s
          kubectl rollout status deployment/inventory-service \
            -n pedidos-veloz --timeout=300s
          kubectl rollout status deployment/payments-service \
            -n pedidos-veloz --timeout=300s

      - name: Deployment status
        if: always()
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n pedidos-veloz

          echo
          echo "=== Pods ==="
          kubectl get pods -n pedidos-veloz

          echo
          echo "=== Services ==="
          kubectl get services -n pedidos-veloz

          echo
          echo "=== HPA ==="
          kubectl get hpa -n pedidos-veloz

      - name: Deployment success
        run: |
          echo "✅ Kubernetes deployment completed successfully!"
