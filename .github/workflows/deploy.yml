name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - gateway
          - inventory
          - orders
          - payments
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: vars
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=ghcr.io/${OWNER_LC}/pedidos-veloz" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.vars.outputs.image_prefix }}-${{ matrix.service }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: self-hosted
    if: ${{ vars.ENABLE_K8S_DEPLOY == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || {
            echo "Secret KUBE_CONFIG não configurado."
            exit 1
          }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Generate application secret manifest
        env:
          K8S_APP_SECRET_YAML: ${{ secrets.K8S_APP_SECRET_YAML }}
        run: |
          test -n "$K8S_APP_SECRET_YAML" || {
            echo "Secret K8S_APP_SECRET_YAML não configurado."
            exit 1
          }
          printf '%s' "$K8S_APP_SECRET_YAML" > k8s/secret.yaml

      - name: Apply namespace and infrastructure
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/infrastructure.yaml
          kubectl apply -f k8s/monitoring.yaml
          kubectl apply -f k8s/grafana-ingress.yaml

      - name: Apply application manifests
        run: |
          kubectl apply -f k8s/apps/
          kubectl apply -f k8s/autoscaling/
          kubectl apply -f k8s/security/

      - name: Update application images
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_PREFIX="ghcr.io/${OWNER_LC}/pedidos-veloz"
          IMAGE_TAG="${{ github.sha }}"
          
          # FORÇA O DEPLOYMENT LOCAL A ADOTAR 1 RÉPLICA ANTES DE ATUALIZAR A IMAGEM
          kubectl apply -f k8s/apps/deployments-services.yaml
          
          kubectl -n pedidos-veloz set image deployment/gateway \
            gateway="${IMAGE_PREFIX}-gateway:${IMAGE_TAG}"
          kubectl -n pedidos-veloz set image deployment/orders \
            orders="${IMAGE_PREFIX}-orders:${IMAGE_TAG}"
          kubectl -n pedidos-veloz set image deployment/payments \
            payments="${IMAGE_PREFIX}-payments:${IMAGE_TAG}"
          kubectl -n pedidos-veloz set image deployment/inventory \
            inventory="${IMAGE_PREFIX}-inventory:${IMAGE_TAG}"

      - name: Verify application rollouts
        run: |
          for service in gateway orders payments inventory; do
            echo "== Checando status do rollout para o serviço: ${service} =="
            
            if ! kubectl -n pedidos-veloz get deployment "${service}" >/dev/null 2>&1; then
              echo "⚠️ [AVISO] Deployment '${service}' não encontrado no cluster. Pulando..."
              continue
            fi
            
            kubectl -n pedidos-veloz rollout status \
              "deployment/${service}" \
              --timeout=60s
          done
