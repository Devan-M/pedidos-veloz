name: Validate

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pedidos
          POSTGRES_USER: pedidos
          POSTGRES_PASSWORD: pedidos-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedidos -d pedidos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orders/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/orders/requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q services

      - name: Run tests
        env:
          DATABASE_URL: postgresql://pedidos:pedidos-ci@127.0.0.1:5432/pedidos
        run: |
          if find services -type f \( -name "test_*.py" -o -name "*_test.py" \) -print -quit | grep -q .; then
            for service in gateway inventory orders payments; do
              echo "== Testing $service =="
              if find "services/$service" -type f \( -name "test_*.py" -o -name "*_test.py" \) -print -quit | grep -q .; then
                (cd "services/$service" && PYTHONPATH=. pytest -q)
              else
                echo "No tests found for $service; skipping."
              fi
            done
          else
            echo "No tests found; skipping pytest."
          fi

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            k8s/*.yaml

      - name: Scan versioned files for hardcoded credentials
        run: |
          if git grep -nEi \
            'postgresql://[^[:space:]]+:[^${[:space:]@]+@|amqp://[^[:space:]]+:[^${[:space:]@]+@|troque-esta-senha|substituir-por-senha-forte' \
            -- . \
            ':!.env' \
            ':!k8s/secret.yaml' \
            ':!.github/workflows/validate.yml'
          then
            echo "Potential hardcoded credential found."
            exit 1
          fi
