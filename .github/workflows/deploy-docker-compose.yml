# .github/workflows/deploy-docker-compose.yml
name: Deploy to Docker Compose Server

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-docker-compose.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load server environment
        run: |
          if [ ! -f /pedidos-veloz/.env ]; then
            echo "❌ /pedidos-veloz/.env not found!"
            exit 1
          fi

          cp /pedidos-veloz/.env "$GITHUB_WORKSPACE/.env"
          chmod 600 "$GITHUB_WORKSPACE/.env"

          echo "✅ Server environment loaded"

      - name: Build Docker images
        run: |
          docker compose build --no-cache

      - name: Stop running containers
        run: |
          docker compose down || true

      - name: Start services
        run: |
          docker compose up -d

      - name: Wait for services to be ready
        run: sleep 15

      - name: Check service health
        run: |
          echo "=== Docker Compose Status ==="
          docker compose ps
          echo ""
          echo "=== Container Logs ==="
          docker compose logs --tail=20

      - name: Verify API Gateway
        run: |
          echo "Testing API Gateway on port 8080..."
          curl -f http://localhost:8080/health || echo "⚠️  Health check endpoint not available"
        continue-on-error: true

      - name: Verify Orders Service
        run: |
          echo "Testing Orders Service on port 3001..."
          curl -f http://localhost:3001/health || echo "⚠️  Health check endpoint not available"
        continue-on-error: true

      - name: Verify Inventory Service
        run: |
          echo "Testing Inventory Service on port 3003..."
          curl -f http://localhost:3003/health || echo "⚠️  Health check endpoint not available"
        continue-on-error: true

      - name: Verify Payments Service
        run: |
          echo "Testing Payments Service on port 3002..."
          curl -f http://localhost:3002/health || echo "⚠️  Health check endpoint not available"
        continue-on-error: true

      - name: Deployment success
        if: success()
        run: |
          echo "✅ Deployment to Docker Compose completed successfully!"
          echo ""
          echo "Services running:"
          echo "  - API Gateway: http://192.168.1.2:8080"
          echo "  - Orders Service: http://192.168.1.2:3001"
          echo "  - Inventory Service: http://192.168.1.2:3003"
          echo "  - Payments Service: http://192.168.1.2:3002"
          echo "  - RabbitMQ Management: http://192.168.1.2:15672"

      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          docker compose logs
          exit 1
