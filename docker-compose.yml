version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pedidos-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: pedidos-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: pedidos-api-gateway
    environment:
      NODE_ENV: ${ENVIRONMENT}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      APP_VERSION: ${APP_VERSION}
    ports:
      - "${API_GATEWAY_PORT}:8080"
    depends_on:
      orders-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payments-service:
        condition: service_started
    networks:
      - pedidos-network
    restart: unless-stopped

  orders-service:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile
    container_name: pedidos-orders-service
    environment:
      NODE_ENV: ${ENVIRONMENT}
      ORDERS_SERVICE_PORT: ${ORDERS_SERVICE_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: pedidos-postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: pedidos-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_HOST: pedidos-rabbitmq
      LOG_LEVEL: ${LOG_LEVEL}
      APP_VERSION: ${APP_VERSION}
    ports:
      - "${ORDERS_SERVICE_PORT}:3001"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - pedidos-network
    restart: unless-stopped

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: pedidos-inventory-service
    environment:
      NODE_ENV: ${ENVIRONMENT}
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: pedidos-postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: pedidos-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
      APP_VERSION: ${APP_VERSION}
    ports:
      - "${INVENTORY_SERVICE_PORT}:3003"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - pedidos-network
    restart: unless-stopped

  payments-service:
    build:
      context: ./services/payments-service
      dockerfile: Dockerfile
    container_name: pedidos-payments-service
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      PAYMENTS_SERVICE_PORT: ${PAYMENTS_SERVICE_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: pedidos-postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: pedidos-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_HOST: pedidos-rabbitmq
      LOG_LEVEL: ${LOG_LEVEL}
      APP_VERSION: ${APP_VERSION}
    ports:
      - "${PAYMENTS_SERVICE_PORT}:3002"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - pedidos-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: pedidos-prometheus
    volumes:
      - ./k8s/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - api-gateway
      - orders-service
      - inventory-service
      - payments-service
    networks:
      - pedidos-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pedidos-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./k8s/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - pedidos-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  pedidos-network:
    driver: bridge