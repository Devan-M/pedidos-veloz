# ============================================================
# DEFAULT DENY
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pedidos-veloz
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ============================================================
# TRAEFIK -> API GATEWAY
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-from-traefik
  namespace: pedidos-veloz
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080


---
# ============================================================
# API GATEWAY -> ORDERS
# ============================================================
