apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: pedidos-veloz
  labels:
    app: jaeger
spec:
  replicas: 1

  selector:
    matchLabels:
      app: jaeger

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: jaeger

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: jaeger
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          imagePullPolicy: IfNotPresent

          ports:
            - name: ui
              containerPort: 16686

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: pedidos-veloz
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger

  ports:
    - name: ui
      port: 16686
      targetPort: ui

    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

    - name: otlp-http
      port: 4318
      targetPort: otlp-http
