global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'pedidos-veloz'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'orders-service'
    static_configs:
      - targets: ['orders-service:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:3003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'payments-service'
    static_configs:
      - targets: ['payments-service:3002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']