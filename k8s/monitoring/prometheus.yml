global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'pedidos-veloz'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['pedidos-api-gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'orders-service'
    static_configs:
      - targets: ['pedidos-orders-service:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['pedidos-inventory-service:3003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'payments-service'
    static_configs:
      - targets: ['pedidos-payments-service:3002']
    metrics_path: '/metrics'
    scrape_interval: 10s