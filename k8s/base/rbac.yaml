apiVersion: v1
kind: ServiceAccount
metadata:
  name: pedidos-sa
  namespace: pedidos-veloz

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pedidos-role
  namespace: pedidos-veloz
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pedidos-rolebinding
  namespace: pedidos-veloz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pedidos-role
subjects:
- kind: ServiceAccount
  name: pedidos-sa
  namespace: pedidos-veloz