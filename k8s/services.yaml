apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: pedidos-veloz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        monitoring: "true"
    spec:
      containers:
        - name: gateway
          image: pedidos-veloz/gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ORDERS_URL
              value: http://orders:8000
            - name: PAYMENTS_URL
              value: http://payments:8000
            - name: INVENTORY_URL
              value: http://inventory:8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: pedidos-veloz
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: pedidos-veloz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        monitoring: "true"
    spec:
      containers:
        - name: orders
          image: pedidos-veloz/orders:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pedidos-credentials
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: pedidos-credentials
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: pedidos-veloz
spec:
  selector:
    app: orders
  ports:
    - port: 8000
      targetPort: 8000
